name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - name: Formatierung
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release-Build
        if: runner.os == 'Windows'
        run: cargo build --locked --release
      - name: Selbsttest an der echten Zwischenablage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\hikidashi.exe -ArgumentList '--selbsttest' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput selbsttest.txt
          Get-Content selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit $($p.ExitCode))" }
      - name: Prüfsumme
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash target\release\hikidashi.exe -Algorithm SHA256).Hash.ToLower()
          "$h  hikidashi.exe" | Set-Content target\release\hikidashi.exe.sha256
          Write-Host "SHA256: $h"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: hikidashi-windows-x64
          path: |
            target/release/hikidashi.exe
            target/release/hikidashi.exe.sha256
          if-no-files-found: error
