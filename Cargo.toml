[package]
name = "hikidashi"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Verlauf der Zwischenablage für Windows: Text, Bilder und Dateien. Alles bleibt lokal."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
